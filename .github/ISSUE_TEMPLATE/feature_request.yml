name: Feature Request
description: Propose an architectural improvement, new distance metric, or recommendation algorithm.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome proposals for new features, vector ranking algorithms, or data pipeline optimizations.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific limitation or pain point?
      placeholder: e.g. I am frustrated that the collaborative filtering signal cannot currently...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Architecture
      description: Detailed description of what you want to happen and the theoretical or algorithmic justification.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative implementations or libraries you investigated.
