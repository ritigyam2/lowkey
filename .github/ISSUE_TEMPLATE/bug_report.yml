name: Bug Report
description: Report an issue, regression, or calculation error in LOWKEY.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much context as possible to help us reproduce and resolve the problem quickly.
  - type: input
    id: environment
    attributes:
      label: Environment Details
      description: OS version, Python version, installed dependencies.
      placeholder: e.g., Ubuntu 22.04 / Windows 11, Python 3.12, hnswlib 0.8.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal reproducible example or command executed.
      placeholder: |
        1. Run `python backend/test_audio_hnsw.py`
        2. Provide payload with ...
        3. Observe error: ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Traceback / Log Output
      description: Paste any terminal logs or stack traces here.
      render: shell
